[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"

[etherscan]
arc_testnet = { key = "NO_KEY_NEEDED", url = "https://explorer.testnet.arc.io/api" }
arc_mainnet = { key = "NO_KEY_NEEDED", url = "https://explorer.arc.io/api" }
